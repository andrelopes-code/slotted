<!--
  The harness runs no script, so the popover's layer is written open and in
  flow, as `filter-bar`'s editor scene writes it: `position: relative` in
  place of the positioner's coordinates, and the room it would measure
  stated as the stage's width.

  The domain is an orders listing: the built-in Default view, and the three
  views a sales desk keeps — Late orders, My region, High value.
-->
<section data-scene="trigger">
  <div
    style="display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 16px"
  >
    <div
      data-ui="saved-views"
      data-ui-saved-views=""
      data-part="root"
      data-part-root=""
      role="group"
      aria-label="Views"
    >
      <button
        data-part="trigger"
        data-part-trigger=""
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        title="Default"
      >
        <span data-label>Default</span>
        <span
          data-ui="icon"
          data-ui-icon=""
          data-part="root"
          data-part-root=""
          data-size="md"
          aria-hidden="true"
          ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-down"></svg
        ></span>
      </button>
    </div>
    <div
      data-ui="saved-views"
      data-ui-saved-views=""
      data-part="root"
      data-part-root=""
      role="group"
      aria-label="Views"
      data-modified
    >
      <button
        data-part="trigger"
        data-part-trigger=""
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        title="Late orders"
      >
        <span data-label>Late orders</span>
        <span data-part="modified" data-part-modified="">Modified</span>
        <span
          data-ui="icon"
          data-ui-icon=""
          data-part="root"
          data-part-root=""
          data-size="md"
          aria-hidden="true"
          ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-down"></svg
        ></span>
      </button>
      <button data-part="revert" data-part-revert="" type="button">
        <span
          data-ui="icon"
          data-ui-icon=""
          data-part="root"
          data-part-root=""
          data-size="sm"
          data-directional
          aria-hidden="true"
          ><svg data-part="glyph" data-part-glyph="" data-glyph="rotate-ccw"></svg></span
        >Revert
      </button>
    </div>
  </div>
</section>
