<!--
  Every picture is an inline SVG data URI, so the page renders with no network
  at all: a capture that silently photographed a failed request would be a
  capture of the fallback pretending to be a photograph. The one request that
  does fail, in the `error` scene, fails on purpose.

  Each photograph carries a band at each of its four edges — yellow at the top,
  green at the bottom, orange at the start, purple at the end — so a crop and
  a focal point can be read from the capture rather than guessed.

  `data-status` is written by hand here because the fragment has no script. In
  both bindings it is the family's own derivation from the `<img>`; the values
  spelled out below are the four that derivation produces.
-->

<!--
  Nothing is reserved without a decision. The first picture has `width` and
  `height`, so the box is 4:3 before the first byte and the picture is its own
  size, shrunk to the column. The second is `fill` inside a box of a stated
  height, and `cover` crops it. The fourth reserved nothing and is still
  loading — its request has not answered, so it has no natural size — and it
  has no height, which is the honest answer.
-->
