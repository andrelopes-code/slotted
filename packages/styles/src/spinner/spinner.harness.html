<!--
  The ring on its own, and at the three steps a host can ask for. It is only
  ever seen inside a host — a button, a select, a combobox — so the page shows
  it the way a host shows it: sized by `--slotted-spinner-size`, colored by
  the ink around it.
-->
<section data-scene="sizes">
  <style>
    [data-demo-row] {
      align-items: center;
      display: flex;
      gap: var(--slotted-space-6);
    }

    [data-demo-label] {
      color: var(--slotted-text-muted);
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
  </style>
  <div data-demo-row>
    <span data-demo-label>sm</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      style="--slotted-spinner-size: var(--slotted-control-icon-size-sm)"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
    <span data-demo-label>md</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
    <span data-demo-label>lg</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      style="--slotted-spinner-size: var(--slotted-control-icon-size-lg)"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
  </div>
</section>

<section data-scene="ink">
  <div data-demo-row style="color: var(--slotted-tone-accent-text)">
    <span data-demo-label>accent text</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
  </div>
  <div data-demo-row style="color: var(--slotted-text-muted)">
    <span data-demo-label>muted text</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
  </div>
  <div
    data-demo-row
    style="
      background: var(--slotted-tone-accent-solid);
      color: var(--slotted-tone-accent-on-solid);
      padding: var(--slotted-space-4);
    "
  >
    <span data-demo-label style="color: inherit">on a filled ground</span>
    <span
      data-ui="spinner"
      data-ui-spinner=""
      data-part="root"
      data-part-root=""
      role="progressbar"
      aria-label="Loading"
      ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.875" />
        <circle cx="12" cy="12" r="8.875" pathLength="100" /></svg
    ></span>
  </div>
</section>
