<!--
  The group is a real `<ul>` and its members are real `<li>`s, so a screen
  reader announces a list of N without the family inventing a role. The label is
  the consumer's `aria-label`, which is the decision `button-group` took for the
  same question.

  The overflow holds an avatar rather than a fourth part painted to look like
  one, and its accessible name is the hidden members' names — joined by
  `Intl.ListFormat` in both bindings, written out by hand here because the
  fragment has no script.
-->
