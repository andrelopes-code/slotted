<!--
  The harness runs no script, so every layer carries what
  `packages/core/src/positioner` would have written on it — `top`, `left`,
  `data-side`, the transform origin, and the room the engine says is left.
  `--slotted-positioner-available-width` is a percentage rather than the
  engine's pixels: it resolves against the stage, so one value holds at all
  three capture widths. The inline placement is `inset-inline-start` where the
  engine writes `left`: the engine measures a mirrored document and writes the
  physical answer, and a fragment that wrote `left` would strand every layer on
  the same edge in a right-to-left capture, which is the one thing that capture
  exists to check.

  Focus is the state this family turns on, and it is photographed rather than
  faked: `shoot.mjs --focus "[data-scene='states'] [data-part='item']:nth-of-type(2)"`
  puts real focus on an item after a Tab press, so `:focus` and `:focus-visible`
  are both the browser's own.

  A scene that shows a menu hanging from something carries `data-fixed` and
  places its layer absolutely, as the engine would. A scene that is only about
  the surface makes the layer `position: relative` instead, so the stage is as
  tall as the surface and not a floor of 420 pixels with a menu in one corner.
-->
