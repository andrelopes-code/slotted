  all: a capture that silently photographed a failed request would be a capture
  of the fallback pretending to be a photograph.

  both bindings it is the family's own derivation from the `<img>`; the values
  spelled out below are the four that derivation produces.

  `alt`, so the avatar announces the same thing in all four statuses.
