<!--
  The DOM both bindings render, written a third time. Every `data-part` the
  contract declares appears here, and each scene is one of the two arrangements
  the family exists to cover rather than a row of specimens.
-->
<section data-scene="numbered">
  <nav
    aria-label="Pagination"
    data-part="root"
    data-part-root=""
    data-ui="pagination"
    data-ui-pagination=""
  >
    <button aria-label="First page" data-part="first" data-part-first="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevrons-right"></svg
      ></span>
    </button>
    <button aria-label="Previous page" data-part="previous" data-part-previous="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-right"></svg
      ></span>
    </button>
    <ul data-part="list" data-part-list="">
      <li data-part="item" data-part-item="">
        <button aria-label="Page 1" data-part="page" data-part-page="" type="button">1</button>
      </li>
      <li data-part="item" data-part-item="">
        <span aria-hidden="true" data-part="ellipsis" data-part-ellipsis="">…</span>
      </li>
      <li data-part="item" data-part-item="">
        <button aria-label="Page 6" data-part="page" data-part-page="" type="button">6</button>
      </li>
      <li data-part="item" data-part-item="">
        <button
          aria-current="page"
          aria-label="Page 7"
          data-part="page"
          data-part-page=""
          type="button"
        >
          7
        </button>
      </li>
      <li data-part="item" data-part-item="">
        <button aria-label="Page 8" data-part="page" data-part-page="" type="button">8</button>
      </li>
      <li data-part="item" data-part-item="">
        <span aria-hidden="true" data-part="ellipsis" data-part-ellipsis="">…</span>
      </li>
      <li data-part="item" data-part-item="">
        <button aria-label="Page 24" data-part="page" data-part-page="" type="button">24</button>
      </li>
    </ul>
    <span data-part="summary" data-part-summary="">Page 7 of 24</span>
    <button aria-label="Next page" data-part="next" data-part-next="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-right"></svg
      ></span>
    </button>
    <button aria-label="Last page" data-part="last" data-part-last="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevrons-right"></svg
      ></span>
    </button>
  </nav>
</section>

<!--
  The bar a table carries: how many rows a page holds, which rows this page is,
  and the two triggers. The label wraps the select, which is what gives the
  control its name from the platform and this stylesheet somewhere to hang the
  chevron.
-->
<section data-scene="bar">
  <nav
    aria-label="Pagination"
    data-part="root"
    data-part-root=""
    data-ui="pagination"
    data-ui-pagination=""
  >
    <label data-part="page-size-label" data-part-page-size-label="">
      Rows per page
      <select data-part="page-size" data-part-page-size="">
        <option>10</option>
        <option selected>20</option>
        <option>50</option>
        <option>100</option>
      </select>
      <span data-ui="icon" data-ui-icon="" data-part="root" data-part-root="" aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-down"></svg
      ></span>
    </label>
    <p aria-live="polite" data-part="status" data-part-status="">121–140 of 482</p>
    <button aria-label="Previous page" data-part="previous" data-part-previous="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-right"></svg
      ></span>
    </button>
    <button aria-label="Next page" data-part="next" data-part-next="" type="button">
      <span
        data-ui="icon"
        data-ui-icon=""
        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
        ><svg data-part="glyph" data-part-glyph="" data-glyph="chevron-right"></svg
      ></span>
    </button>
  </nav>
</section>

<!--
  A collection whose total the server does not know. There are no page numbers
  to draw, so there are none; the family never invents a total, which is what
  section 7 of the feature guide asks of it.
-->

      data-part-previous=""

        data-part="root"
        data-part-root=""
        data-directional
        aria-hidden="true"
