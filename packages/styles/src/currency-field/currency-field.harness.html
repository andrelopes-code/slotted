  all, because that is the string the control actually holds. The stepper
  glyphs are the empty `Glyph` element the build draws, so nothing here draws
  a character as an icon; the adornment marks are text, which is what an
  adornment is when it is not a glyph.

  The DOM differs by arrangement on purpose: under `stacked` the two buttons
  share a `stepper` box after the value; under `split` they are direct children
  of the frame, decrement first and increment last, so the reading order and
  the painted order are the same one.
