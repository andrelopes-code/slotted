<!--
  `rows` and `maxRows` reach the stylesheet as two custom properties, because
  CSS cannot read an HTML attribute and `field-sizing: content` stops `rows`
  from being the floor. The bindings write them; this page writes them by hand
  so the same arithmetic is on screen.
-->

</section>
