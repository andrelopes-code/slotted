<!--
  Nothing on this page is positioned by `packages/core/src/positioner`, because
  the harness runs no script. Every layer therefore carries the exact four
  things the module would have written on it — `top`, `left`, `data-side` and
  `--slotted-positioner-arrow-x` or `-arrow-y` — as inline values, so the
  picture is the one a measured layer produces rather than an approximation of
  it. `transform-origin` is written the same way, and `translate` is used for
  the centring, which is the property the family deliberately left free by
  animating `scale` instead of `transform`.

  The arrow offsets are percentages rather than the pixels the engine writes.
  An inset percentage resolves against the layer's own box, so one value centres
  the arrow at every width the page is captured at; the engine's pixel is the
  same number once it has measured.

  `--slotted-positioner-available-width` is written the same way, as `100%` of
  the stage rather than as the pixels the engine measures. Without it the
  family's own `min(measure, available)` falls back to `100vw` — the capture
  window, not the cell — and the 240-pixel capture showed a 288-pixel tooltip
  clipped by the stage instead of the narrowing the family actually does.
-->
<section data-scene="anatomy" data-fixed>
  <div style="position: relative; display: flex; justify-content: center; padding-block: 72px">
    <button
      data-ui="button"
      data-ui-button=""
      data-part="root"
      data-part-root=""
      data-tone="secondary"
      data-variant="outline"
      data-size="md"
      type="button"
    >
      <span data-part="label" data-part-label="">Save draft</span>
    </button>
    <div
      data-ui="tooltip"
      data-ui-tooltip=""
      data-part="root"
      data-part-root=""
      data-side="top"
      data-align="center"
      data-variant="inverse"
      data-size="md"
      data-hoverable
      data-open
      style="
        top: 0;
        left: 50%;
        translate: -50% 0;
        --slotted-positioner-arrow-x: calc(50% - 0.25rem);
        --slotted-positioner-available-width: 100%;
        --slotted-positioner-transform-origin: center bottom;
      "
    >
      <div data-part="arrow" data-part-arrow=""></div>
      <div data-part="content" data-part-content="" role="tooltip">Saves without publishing</div>
    </div>
  </div>
</section>
