name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # The release commit changes only the versions and CHANGELOG.md of a commit
    # CI already passed; `pnpm release` refuses to cut one from anything else.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The React package's `*.browser.test.tsx` run in Chromium.
      - name: Install Chromium
        run: pnpm --filter @slotted/react exec playwright install --with-deps chromium

      # `pnpm typecheck` reads each package's declarations through `exports`,
      # which a clean checkout has not built yet.
      - name: Build packages
        run: pnpm build

      - name: Validate repository
        run: pnpm check:full
