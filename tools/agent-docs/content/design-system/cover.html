<!-- @dsCard height=288 -->
<div class="cover">
  <style>
    .cover {
      position: relative;
      block-size: 288px;
      inline-size: 960px;
      overflow: hidden;
      background: var(--slotted-surface);
      color: var(--slotted-text);
    }
    .cover svg {
      position: absolute;
      inset: 0;
    }
    .brand {
      fill: var(--slotted-tone-accent-solid);
    }
    .ink {
      fill: var(--slotted-surface-inverse);
    }
    .tint {
      fill: var(--slotted-tone-accent-surface);
    }
    .done {
      fill: var(--slotted-tone-success-solid);
    }
    .block {
      rx: var(--slotted-radius-lg);
    }
    .slot {
      fill: var(--slotted-surface);
      rx: var(--slotted-radius-sm);
    }
    .name {
      position: absolute;
      inset-inline-start: 40px;
      inset-block-end: 40px;
      max-inline-size: 440px;
    }
    .name h1 {
      margin: 0;
      font-family: var(--font-heading), var(--font-sans), sans-serif;
      font-size: 104px;
      font-weight: 600;
      line-height: 0.92;
      letter-spacing: -0.02em;
    }
    .name p {
      margin: 16px 0 0;
      font-family: var(--font-sans), sans-serif;
      font-size: 14px;
      color: var(--slotted-text-muted);
    }
  </style>
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: slotted-tone-accent-solid 320×192, slotted-surface-inverse 160×288, slotted-tone-accent-surface 192×80, slotted-tone-success-solid 96×80; sides are multiples of space-4 (8px)
      arrangement: one tall ink slab bleeding off the right edge, the brand block bleeding off the top, two short blocks bleeding off the bottom
      pattern: geometric, modular, dense UI (a library of slots a family fills) -> tiles cut from the ink slab, some merged two-wide like the families
      steps and radii: tile 32 at a pitch of 40 (space-9 plus space-4), radius-lg on blocks, radius-sm on tiles
    -->
    <rect class="brand block" x="480" y="-8" width="320" height="200" />
    <rect class="ink block" x="808" y="-8" width="160" height="304" />
    <rect class="tint block" x="480" y="200" width="192" height="96" />
    <rect class="done block" x="680" y="200" width="120" height="96" />
    <rect class="slot" x="824" y="24" width="72" height="32" />
    <rect class="slot" x="904" y="24" width="32" height="32" />
    <rect class="slot" x="824" y="64" width="32" height="32" />
    <rect class="slot" x="864" y="64" width="72" height="32" />
    <rect class="slot" x="824" y="104" width="32" height="32" />
    <rect class="slot" x="864" y="104" width="32" height="32" />
    <rect class="slot" x="904" y="104" width="32" height="32" />
    <rect class="slot" x="824" y="144" width="112" height="32" />
    <rect class="slot" x="824" y="184" width="32" height="32" />
    <rect class="slot" x="864" y="184" width="32" height="32" />
    <rect class="slot" x="904" y="184" width="32" height="32" />
    <rect class="slot" x="824" y="224" width="72" height="32" />
    <rect class="slot" x="904" y="224" width="32" height="32" />
  </svg>
  <div class="name">
    <h1>Slotted</h1>
    <p>Component families for React and Angular, themed by tokens.</p>
  </div>
</div>
